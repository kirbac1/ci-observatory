name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.14"] # the oldest and newest supported versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Unit tests
        run: uv run pytest
      - name: Build the site and the demo report
        run: sh scripts/build-site.sh "$RUNNER_TEMP/site"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: ruff
        run: uv run ruff check && uv run ruff format --check
      - name: mypy
        run: uv run mypy
      - name: Page scripts parse
        run: for f in src/ci_observatory/web/*.js; do node --check "$f"; done
      - name: Shell scripts parse
        run: sh -n install.sh && sh -n scripts/build-site.sh
