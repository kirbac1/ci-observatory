[project]
name = "ci-observatory"
version = "0.2.0"
description = "One command that maps CI/CD speed, failures, repeated tests, DORA metrics and AI use across GitHub repositories, public or private."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kirbac1" }]
dependencies = []
keywords = ["github-actions", "ci", "cd", "dora", "developer-experience", "devex", "observability", "flaky-tests"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://kirbac1.github.io/ci-observatory/"
Demo = "https://kirbac1.github.io/ci-observatory/demo/"
Repository = "https://github.com/kirbac1/ci-observatory"
Documentation = "https://github.com/kirbac1/ci-observatory#readme"

[project.scripts]
ci-observatory = "ci_observatory.cli:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ci-observatory[server]",
    "httpx2==2.14.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_observatory"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
